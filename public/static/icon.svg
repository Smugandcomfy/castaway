<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cast Away">
  <!-- Hexagram 11, Tai - "Peace": Kun (earth) above, Qian (heaven) below,
       the one arrangement in which the two actually meet. Six lines, drawn
       as art rather than the U+4DC0 glyph so it renders without a CJK font.
       The previous mark had only five lines. -->
  <rect width="64" height="64" rx="5" fill="#06080b"/>
  <g fill="#c79a4b">
    <rect x="10" y="7" width="18" height="5" rx="1"/>
    <rect x="36" y="7" width="18" height="5" rx="1"/>
    <rect x="10" y="16" width="18" height="5" rx="1"/>
    <rect x="36" y="16" width="18" height="5" rx="1"/>
    <rect x="10" y="25" width="18" height="5" rx="1"/>
    <rect x="36" y="25" width="18" height="5" rx="1"/>
    <rect x="10" y="34" width="44" height="5" rx="1"/>
    <rect x="10" y="43" width="44" height="5" rx="1"/>
    <rect x="10" y="52" width="44" height="5" rx="1"/>
  </g>
</svg>
